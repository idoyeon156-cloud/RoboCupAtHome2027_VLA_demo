piper_collision_guard:
  ros__parameters:
    # Example thresholds, NOT measured Piper stopping distances.
    enforce: false
    geometry_confirmed: false
    rate_hz: 50.0
    # Extra gap between protective sphere SURFACES, not joint centre distance.
    stop_clearance_m: 0.01
    resume_clearance_m: 0.04
    feedback_timeout_s: 0.15
    target_timeout_s: 0.15
    max_arm_skew_s: 0.05
    # Default: joint origins + gripper centre only (90 mm centre threshold).
    link_samples: 0
    path_step_rad: 0.02
    max_path_samples: 100
    driver_speed_ratio: 10
    gripper_effort_nm: 1.0
