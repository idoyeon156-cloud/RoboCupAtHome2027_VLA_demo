# Positions: world frame, metres. Both object origins are BOTTOM CENTRES.
# Initial bottoms share the robot base mounting plane: world Z=0.
alpha:
  joint_deg: [0, 90, 0, 0, -70, 0]  # Identical for both arms, J1..J6.
tool:
  tcp_in_gripper_base_m: [0, 0, 0.138]
bowl:
  bottom_center_world_m: [0.49, 0.115, 0.0]
  rpy_deg: [0, 0, 0]
  diameter_m: 0.170
  height_m: 0.055
  grasp_offset_world_m: [0, 0.085, 0.035]  # world +Y = left; +Z = sky.
  gripper_rpy_in_object_deg: [0, 110, -15]
  gripper_open_opening_mm: 30
  gripper_closed_opening_mm: 10
box:
  bottom_center_world_m: [0.47, -0.20, 0.0]
  rpy_deg: [0, 0, 0]
  size_m: [0.08, 0.06, 0.22]
  grasp_offset_world_m: [0, 0, 0.08]
  gripper_rpy_in_object_deg: [0, 110, 0]
  gripper_open_opening_mm: 80
  gripper_closed_opening_mm: 60
  outlet_in_object_m: [0.04, -0.03, 0.22]
pour:
  bowl_bottom_center_world_m: [0.49, 0.115, 0.10]
  tilt_axis_world: [-1, 0, 0]
  tilt_deg: [0, 25, 45, 65]
  # Each is relative to the held bowl's top centre, world coordinates.
  outlet_offsets_world_m:
    - [0, -0.15, 0.16]
    - [0, -0.12, 0.15]
    - [0, -0.08, 0.14]
    - [0, -0.04, 0.12]
motion:
  joint_speed_deg_s: 15
  opening_speed_mm_s: 20
  approach_distance_m: 0.04
  cartesian_step_m: 0.01
  lift_m: 0.06
  home_hold_s: 2
  alpha_hold_s: 1
  grasp_hold_s: 0.5
  pour_hold_s: 1
planning:
  check_joint_distance: true
  collision_step_deg: 1.0
  ik_restarts: 20
  rrt_step_deg: 15
  rrt_timeout_s: 25
  random_seed: 332
