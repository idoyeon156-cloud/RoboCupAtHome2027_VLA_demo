# All positions use the dual URDF's world frame. Lengths in metres unless noted.
# The bowl centre is at the rim height. Both tools are assumed to hold their objects.
bowl:
  center_world_m: [0.395, 0.035, 0.218]
  diameter_m: 0.170
  depth_m: 0.060
  rim_grip_opening_mm: 10
  grip_azimuth_deg: 120
  gripper_yaw_deg: -20
box:
  # X depth, Y thickness between jaws, Z height in the upright pose.
  size_m: [0.080, 0.060, 0.220]
  grip_below_top_m: 0.100
  staging_outlet_world_m: [0.343, -0.125, 0.360]
# Mouth offset from the bowl centre in Y, and height above the rim in Z.
# Ordered by tilt angle: 0, 25, 45, 65 degrees.
outlet_yz_offsets_m:
  - [-0.110, 0.142]
  - [-0.075, 0.140]
  - [-0.050, 0.119]
  - [-0.030, 0.090]
